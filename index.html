<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prosafety – návrhy nového webu</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E1420;color:#F2F4F7;font-family:Inter,sans-serif}
main{max-width:1100px;margin:0 auto;padding:56px 24px 72px}
h1{margin:36px 0 10px;font:700 clamp(34px,5vw,56px)/1.05 'Space Grotesk',sans-serif;letter-spacing:-.02em}
p.lead{margin:0 0 40px;color:#A7B0C0;font-size:18px;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px}
.card{display:block;border:1px solid #263148;border-radius:14px;overflow:hidden;background:#121A28;color:#F2F4F7;text-decoration:none}
.card:hover{border-color:#5A6578}
.card img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
.card div{padding:22px 24px 26px}
.card h2{margin:0;font:600 24px/1.2 'Space Grotesk',sans-serif}
.card p{margin:8px 0 0;color:#A7B0C0;font-size:15px;line-height:1.55}
.card span{display:inline-block;margin-top:16px;font-weight:600}
.a span{color:#FF8A47}.d span{color:#FFC21A}
</style>
</head>
<body>
<main>
  <img src="img/logo-light.png" alt="Prosafety" style="height:52px">
  <h1>Návrhy nového webu</h1>
  <p class="lead">Dva návrhy domovskej stránky prosafety.sk. Fungujú na počítači aj na mobile.</p>
  <div class="grid">
    <a class="card a" href="a/">
      <img src="img/A1.jpg" alt="">
      <div><h2>Návrh A – Nočná stavba</h2><p>Tmavý dizajn, oranžový akcent, fotky za súmraku.</p><span>Otvoriť návrh A →</span></div>
    </a>
    <a class="card d" href="d/">
      <img src="img/D1.jpg" alt="">
      <div><h2>Návrh D – Signálna žltá</h2><p>Tmavý dizajn, bezpečnostná žltá, nočné fotky, písmo v štýle DIN.</p><span>Otvoriť návrh D →</span></div>
    </a>
  </div>
</main>
</body>
</html>
